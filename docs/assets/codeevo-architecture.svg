<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">CodeEvo architecture</title>
  <desc id="desc">Evaluation-gated multi-agent code review architecture from pull request ingestion through evidence review, feedback and controlled evolution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#111b26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d91a5"/>
    </marker>
    <style>
      .title{font:700 40px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f8fb;letter-spacing:-1px}
      .subtitle{font:400 17px ui-sans-serif,system-ui,sans-serif;fill:#8fa2b5}
      .lane{font:700 12px ui-sans-serif,system-ui,sans-serif;fill:#6f8498;letter-spacing:2px}
      .head{font:700 18px ui-sans-serif,system-ui,sans-serif;fill:#f1f6fa}
      .body{font:400 13px ui-sans-serif,system-ui,sans-serif;fill:#9fb0c0}
      .metric{font:700 23px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#62e6b2}
      .small{font:500 11px ui-sans-serif,system-ui,sans-serif;fill:#7e93a6;letter-spacing:.4px}
      .line{stroke:#60778a;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#42c99c;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="1230" cy="-40" r="300" fill="#153e45" opacity=".22"/>
  <circle cx="170" cy="770" r="280" fill="#1f2e48" opacity=".22"/>

  <text x="72" y="72" class="title">CodeEvo</text>
  <text x="72" y="105" class="subtitle">Evidence-grounded agents. Evaluation-gated evolution.</text>
  <rect x="1080" y="50" width="286" height="58" rx="12" fill="#0c171f" stroke="#28404e"/>
  <text x="1100" y="75" class="small">VUL4J VALIDATION · SINGLE AGENT</text>
  <text x="1100" y="98" class="metric">F1 0.50</text>
  <text x="1210" y="98" class="body">· 100% run success</text>

  <text x="72" y="166" class="lane">INGEST</text>
  <text x="312" y="166" class="lane">ORCHESTRATE</text>
  <text x="600" y="166" class="lane">GROUND</text>
  <text x="888" y="166" class="lane">DECIDE</text>
  <text x="1160" y="166" class="lane">DELIVER</text>

  <g filter="url(#shadow)">
    <rect x="72" y="192" width="190" height="150" rx="18" fill="#101d28" stroke="#2d4352"/>
    <rect x="92" y="214" width="42" height="42" rx="10" fill="#193245"/>
    <path d="M104 236h18m-9-9v18" stroke="#65dcb0" stroke-width="2"/>
    <text x="92" y="286" class="head">Pull request</text>
    <text x="92" y="312" class="body">API · GitHub webhook</text>
    <text x="92" y="330" class="body">HMAC · tenant boundary</text>

    <rect x="312" y="192" width="238" height="150" rx="18" fill="#101d28" stroke="#2d4352"/>
    <text x="334" y="228" class="head">Agent Runtime</text>
    <text x="334" y="256" class="body">Bounded state machine</text>
    <text x="334" y="278" class="body">Checkpoint · resume · retry</text>
    <rect x="334" y="300" width="194" height="22" rx="6" fill="#152b32"/>
    <text x="346" y="315" class="small">PLAN → TOOL → OBSERVE → FINAL</text>

    <rect x="600" y="192" width="238" height="150" rx="18" fill="#101d28" stroke="#2d4352"/>
    <text x="622" y="228" class="head">Context + Tools</text>
    <text x="622" y="256" class="body">Risk-ranked diff compression</text>
    <text x="622" y="278" class="body">Tree-sitter · read-only repo</text>
    <text x="622" y="300" class="body">Memory · evidence ledger</text>
    <text x="622" y="322" class="small">TOKEN / STEP / TIME BUDGETS</text>

    <rect x="888" y="192" width="222" height="150" rx="18" fill="#101d28" stroke="#2d4352"/>
    <text x="910" y="228" class="head">Multi-agent review</text>
    <text x="910" y="256" class="body">Planner · Specialists · Critic</text>
    <text x="910" y="278" class="body">Evidence · Verifier · Arbiter</text>
    <rect x="910" y="300" width="176" height="22" rx="6" fill="#173329"/>
    <text x="922" y="315" class="small" fill="#65dcb0">FAIL CLOSED ON HIGH RISK</text>

    <rect x="1160" y="192" width="206" height="150" rx="18" fill="#101d28" stroke="#2d4352"/>
    <text x="1182" y="228" class="head">Review output</text>
    <text x="1182" y="256" class="body">CWE findings · evidence</text>
    <text x="1182" y="278" class="body">Fix + regression test</text>
    <text x="1182" y="300" class="body">PR comment · audit report</text>
  </g>

  <path d="M262 267H312" class="line"/>
  <path d="M550 267H600" class="line"/>
  <path d="M838 267H888" class="line"/>
  <path d="M1110 267H1160" class="line"/>

  <rect x="72" y="405" width="1294" height="270" rx="24" fill="#0b151e" stroke="#263946"/>
  <text x="98" y="443" class="lane">CONTROLLED EVOLUTION LOOP</text>

  <g filter="url(#shadow)">
    <rect x="98" y="470" width="205" height="142" rx="16" fill="#111f2a" stroke="#2d4352"/>
    <text x="120" y="505" class="head">Feedback</text>
    <text x="120" y="533" class="body">False positive · missed issue</text>
    <text x="120" y="555" class="body">Bad fix · reviewer decision</text>
    <text x="120" y="584" class="small">AUDITABLE SIGNAL ONLY</text>

    <rect x="365" y="470" width="220" height="142" rx="16" fill="#111f2a" stroke="#2d4352"/>
    <text x="387" y="505" class="head">Candidate</text>
    <text x="387" y="533" class="body">Prompt · declarative Skill</text>
    <text x="387" y="555" class="body">Routing policy</text>
    <text x="387" y="584" class="small">PARENT VERSION + SHA-256</text>

    <rect x="647" y="454" width="270" height="174" rx="18" fill="#10252a" stroke="#42c99c" stroke-width="2"/>
    <text x="671" y="493" class="head">Evaluation Gate</text>
    <text x="671" y="523" class="body">Repository-isolated splits</text>
    <text x="671" y="547" class="body">Precision · Recall · F1</text>
    <text x="671" y="571" class="body">P95 · Token · Cost</text>
    <rect x="671" y="590" width="220" height="22" rx="6" fill="#173329"/>
    <text x="684" y="605" class="small">HOLDOUT REQUIRES CONFIRMATION</text>

    <rect x="979" y="470" width="205" height="142" rx="16" fill="#111f2a" stroke="#2d4352"/>
    <text x="1001" y="505" class="head">Safe rollout</text>
    <text x="1001" y="533" class="body">Shadow · Canary · Activate</text>
    <text x="1001" y="555" class="body">Metric guardrails</text>
    <text x="1001" y="584" class="small">EXPLICIT APPROVAL STATE</text>

    <rect x="1225" y="470" width="115" height="142" rx="16" fill="#111f2a" stroke="#2d4352"/>
    <text x="1247" y="505" class="head">Audit</text>
    <text x="1247" y="535" class="body">Reject</text>
    <text x="1247" y="557" class="body">Rollback</text>
    <text x="1247" y="579" class="body">Trace</text>
  </g>

  <path d="M303 541H365" class="dash"/>
  <path d="M585 541H647" class="dash"/>
  <path d="M917 541H979" class="dash"/>
  <path d="M1184 541H1225" class="line"/>
  <path d="M1268 470C1268 398 1215 382 1160 342" class="dash"/>
  <path d="M1160 342C1090 383 220 372 200 470" class="dash"/>

  <text x="72" y="720" class="small">PYTHON · FASTAPI · DEEPSEEK · TREE-SITTER · POSTGRESQL · REDIS STREAMS · OPENTELEMETRY</text>
  <text x="1366" y="720" text-anchor="end" class="small">CODEEVO / 2026</text>
</svg>

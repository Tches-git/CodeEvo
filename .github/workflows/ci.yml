name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check codeevo tests scripts
      - run: python -m compileall -q codeevo scripts skills
      - run: python -m unittest discover -s tests -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codeevo
          POSTGRES_USER: codeevo
          POSTGRES_PASSWORD: codeevo-integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeevo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      CODEEVO_INTEGRATION_DATABASE_URL: postgresql://codeevo:codeevo-integration@127.0.0.1:5432/codeevo
      CODEEVO_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests/integration -v

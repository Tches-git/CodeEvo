name: codeevo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeevo
      POSTGRES_USER: codeevo
      POSTGRES_PASSWORD: ${CODEEVO_POSTGRES_PASSWORD:?set CODEEVO_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeevo -d codeevo"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  codeevo:
    build:
      context: .
      args:
        VCS_REF: ${CODEEVO_IMAGE_REVISION:-local}
        PIP_INDEX_URL: ${CODEEVO_PIP_INDEX_URL:-https://pypi.org/simple}
    image: codeevo:${CODEEVO_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    ports:
      - "${CODEEVO_BIND_ADDRESS:-127.0.0.1}:${CODEEVO_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      CODEEVO_HOST: 0.0.0.0
      CODEEVO_PORT: 8080
      CODEEVO_DATABASE_URL: postgresql://codeevo:${CODEEVO_POSTGRES_PASSWORD}@postgres:5432/codeevo
      CODEEVO_REDIS_URL: redis://redis:6379/0
      CODEEVO_ASYNC_WORKERS: ${CODEEVO_ASYNC_WORKERS:-4}
      CODEEVO_SKILLS_DIR: /app/skills
      CODEEVO_AUTH_REQUIRED: "true"
      CODEEVO_AUTH_SECRET: ${CODEEVO_AUTH_SECRET:?set a random CODEEVO_AUTH_SECRET of at least 32 bytes}
      CODEEVO_BOOTSTRAP_ADMIN_USERNAME: ${CODEEVO_BOOTSTRAP_ADMIN_USERNAME:?set CODEEVO_BOOTSTRAP_ADMIN_USERNAME}
      CODEEVO_BOOTSTRAP_ADMIN_PASSWORD: ${CODEEVO_BOOTSTRAP_ADMIN_PASSWORD:?set a strong CODEEVO_BOOTSTRAP_ADMIN_PASSWORD}
      CODEEVO_GUEST_DEMO_ENABLED: ${CODEEVO_GUEST_DEMO_ENABLED:-false}
      CODEEVO_GUEST_DEMO_TENANT_ID: ${CODEEVO_GUEST_DEMO_TENANT_ID:-public-demo}
      CODEEVO_GUEST_DEMO_TTL_SECONDS: ${CODEEVO_GUEST_DEMO_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
